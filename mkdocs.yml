site_name: AVLite Documentation
site_description: Modular Autonomous Vehicle Stack
site_author: AV-Lab

repo_name: AV-Lab/avlite
repo_url: https://github.com/AV-Lab/avlite

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Plugin Development: plugin-development.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
